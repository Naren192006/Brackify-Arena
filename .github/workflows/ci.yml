name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Code Quality & Linting
  # =========================================================================
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dev dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Install the full dependency set so mypy resolves real packages:
          # a hand-picked subset produces false "unused type: ignore" and
          # no-any-return errors.
          pip install -e ".[dev]"

      - name: Backend Ruff Lint
        working-directory: backend
        run: ruff check app tests

      - name: Backend Mypy Typecheck
        working-directory: backend
        run: mypy app --ignore-missing-imports

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Frontend ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend Typecheck
        working-directory: frontend
        run: npm run typecheck

  # =========================================================================
  # 2. Automated Testing (Backend & Frontend)
  # =========================================================================
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tournament
          POSTGRES_PASSWORD: tournament
          POSTGRES_DB: tournament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tournament:tournament@localhost:5432/tournament_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-long!!
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://tournament:tournament@localhost:5432/tournament_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-minimum-32-characters-long!!
          ENVIRONMENT: test
        run: pytest -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm run test

  # =========================================================================
  # 3. Production Build Verification
  # =========================================================================
  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build Next.js Production Bundle
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.brackifyarena.com
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-mock-key
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_mockkey123
        run: npm run build

      - name: Build Backend Docker Image
        run: docker build -t brackify-backend:latest -f backend/Dockerfile backend/

  # =========================================================================
  # 4. Deployment Readiness Gate
  # =========================================================================
  deploy-gate:
    name: Deployment Readiness Gate
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Certify Production Deployment Readiness
        run: |
          echo "========================================================"
          echo "All Lint, Test, and Build checks passed successfully."
          echo "Release is certified for deployment to Vercel and Render."
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "========================================================"
